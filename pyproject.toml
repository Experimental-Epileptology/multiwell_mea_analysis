[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multiwell-mea-analysis"
version = "0.1.0"
description = "Shared MEA burst-detection, feature-extraction, and QC-widget toolkit"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "numba",
    "matplotlib",
    "ipywidgets",
    "ipython",
]

[tool.setuptools]
packages = ["multiwell_mea_analysis"]
